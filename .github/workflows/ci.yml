name: Fronted

on:
  push:
    branches: [main, staging, mvp]
  pull_request:
    branches: [main, staging, mvp]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: cd apps/frontend && bun run type-check

      - name: Lint
        run: cd apps/frontend && bun run lint

      - name: Test
        run: cd apps/frontend && bun test

      - name: Build
        run: cd apps/frontend && bun run build
