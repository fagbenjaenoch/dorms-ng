name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd apps/frontend && bun install

      - name: Type check
        run: cd apps/frontend && bun run type-check

      - name: Lint
        run: cd apps/frontend && bun run lint

      - name: Test
        run: cd apps/frontend && bun run test

      - name: Build
        run: cd apps/frontend && bun run build
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: |
          cd apps/backend
          go mod download

      - name: Run unit tests with coverage
        run: |
          cd apps/backend
          go test ./... -race -coverprofile=coverage.out -covermode=atomic -tags=!integration

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage.out

  integration-test:
    runs-on: ubuntu-latest
    # Only run on push to main or manually triggered (optional)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: |
          cd apps/backend
          go mod download

      - name: Run integration tests
        run: |
          cd apps/backend
          go test ./... -race -cover -tags=integration -coverprofile=integration-coverage.out

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: apps/backend/integration-coverage.out
